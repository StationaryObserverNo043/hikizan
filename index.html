     ※ og:url は、わざと書いていません。書くと、LINE・Facebookなどが「古いカードの記憶」を

<meta name="twitter:image:alt" content="予算管理アプリ「ヒキザン」。電卓のロゴと、気持ちよさそうに眠る三毛猫。">
<style>
/* =========================================================
   デザイン設定（色・大きさはここで一括変更できます）
   ========================================================= */
:root{
  --bg:#f7f3ea;          /* 背景：あたたかいベージュ */
  --card:#ffffff;
  --ink:#2b3530;         /* 文字色 */
  --sub:#55625a;         /* 補足の文字色（背景に対して 5.8:1 以上） */
  --line:#e8e2d2;
  --brand:#2b6cb0;       /* ブランドの青：ボタン・ゲージ（白文字で 5.4:1） */
  --brand-d:#1f4f8f;     /* ロゴ・タイトル画面と同じ紺：文字・選択中の色 */
  --brand-l:#e6eff9;     /* 薄い青：背景のアクセント */
  --blue:var(--brand);    /* リングゲージ：使った分の青 */
  --beige:#f0e9d8;
  --warn:#c9761f;        /* 予算オーバー時のやわらかい橙 */
  --warn-l:#fdf0df;
  --warn-d:#a35a0c;      /* 橙の「文字用」：白地で 7:1（--warn は大きい文字と線だけに使う） */
  --danger:#c4453b;
  --radius:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP","BIZ UDPGothic",Meiryo,system-ui,sans-serif;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;
  line-break:strict;word-break:keep-all;overflow-wrap:break-word}   /* 語の途中では折らない。折る位置は下の <wbr> 挿入スクリプトが文節ごとに用意する */
p,li,.perday,.notice,.empty,.ob-copy{text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
::placeholder{color:#6b756e;opacity:1}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.muted{color:var(--sub)}
.small{font-size:15px}

#app{position:relative;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh}
#screen{padding:6px 16px calc(124px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:0 4px 10px;padding-right:100px}
.top h1{font-size:22px;font-weight:800}
.top .sub{color:var(--sub);font-size:15px}

/* ---------- カード・ボタン ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 2px 0 var(--line),0 8px 20px rgba(80,70,40,.05)}
.card h2{font-size:19px;margin-bottom:8px}
.notice{background:var(--warn-l);border:1px solid #f0d4ab;border-radius:18px;padding:14px 16px;margin-bottom:14px}
.notice.ok{background:var(--brand-l);border-color:#c3d8ee}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:12px 18px;
  border-radius:18px;border:2px solid transparent;font-weight:700;font-size:18px;text-align:center;text-decoration:none;
  margin-top:12px;user-select:none;-webkit-user-select:none;background:none}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn.soft{background:var(--brand-l);color:var(--brand-d)}
.btn.ghost{color:var(--sub);border-color:var(--line);background:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.dangerline{background:#fff;color:var(--danger);border-color:#efc4bf}
.btn.big{min-height:74px;font-size:21px;border-radius:22px}
.btn.btn2{flex-direction:column;gap:2px;line-height:1.3}
.btn2 .l1,.btn2 .l2{white-space:nowrap}
.btn2 .l1{font-size:15px;font-weight:600;opacity:.9;letter-spacing:.02em}
.btn2 .l2{font-size:22px;font-weight:800;letter-spacing:.04em}
.btn[disabled]{opacity:.4}

/* ---------- ホームの大きなカード ---------- */
.hero{padding:22px 20px;background:linear-gradient(180deg,#fff 0%,#f2f7fc 100%)}
.hero .q{font-size:22px;font-weight:800;margin-bottom:10px}
.lead{color:var(--sub);font-size:17px}
.big{font-size:52px;font-weight:800;letter-spacing:-.5px;color:var(--brand-d);line-height:1.15}
.big small{font-size:26px;margin-left:2px;font-weight:700}
.big.warn{color:var(--warn)}
.perday-sub{font-size:15px;color:var(--sub);margin-top:2px}
.perday{margin:6px 0 10px;background:var(--brand-l);border-radius:16px;padding:12px 14px;font-size:18px;text-align:center}
.perday b{font-size:25px;color:var(--brand-d)}
.nw{display:inline-block;white-space:nowrap}
.perday.warn{background:var(--warn-l);color:#7a4a12}
.days{margin:8px 2px 0;text-align:center;color:var(--sub);font-size:16px}
.days b{color:var(--ink)}
.bar{height:12px;background:#ece6d6;border-radius:99px;overflow:hidden;margin:16px 0 12px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.bar.warn i{background:var(--warn)}

/* ---------- 残り予算のリングゲージ（使った分が青で時計回りにふえる） ---------- */
.ring{--s:min(56vw,208px);position:relative;width:var(--s);height:var(--s);margin:10px auto 16px}
.ringsvg{display:block;width:100%;height:100%}
.rtrack{fill:none;stroke:#ece6d6;stroke-width:4}
.rarc{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:var(--p) var(--r);animation:ringgrow .9s ease-out both}
.ring.warn .rarc{stroke:var(--warn)}
@keyframes ringgrow{from{stroke-dasharray:var(--p0,0) var(--r0,100)}to{stroke-dasharray:var(--p) var(--r)}}
.ring.still .rarc{animation:none}   /* 金額が変わっていないときは、アニメーションを繰り返さない */

.rcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14%}
.rl{font-size:max(14px,calc(var(--s) * .065));color:var(--sub);font-weight:700;line-height:1.3}
.rn{font-size:calc(var(--s) * var(--k,.13));font-weight:800;line-height:1.15;letter-spacing:-.5px;color:var(--ink);white-space:nowrap}
.rn small{font-size:.55em;margin-left:1px;font-weight:700}
.ring.over .rn{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.rarc{animation:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.one{grid-template-columns:1fr;margin-top:14px}
.two>div{background:#faf7ef;border-radius:14px;padding:10px 12px}
.two span{display:block;font-size:15px;color:var(--sub)}
.two b{font-size:19px}

.sec-head{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 8px}
.sec-head h2{font-size:18px}
.linkbtn{background:none;border:0;color:var(--brand-d);font-weight:700;font-size:16px;padding:8px 4px;min-height:44px}

/* ---------- 支出の行 ---------- */
.dayhead{margin:18px 4px 6px;font-weight:700;color:var(--sub);font-size:15px}
.item{display:flex;width:100%;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:12px 16px;margin-bottom:8px;text-align:left;min-height:70px}
.item:active{background:#faf7ef}
.item .ic{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px}
.item .mid{min-width:0;flex:1}
.item .nm{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cat{font-size:15px;color:var(--sub)}
.item .amt{margin-left:auto;font-weight:800;font-size:19px;white-space:nowrap}
.empty{text-align:center;padding:34px 12px;color:var(--sub)}
.empty .em{font-size:44px;margin-bottom:6px}

/* ---------- 月の切り替え・タブ ---------- */
.monthnav{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;background:#fff;border-radius:18px;border:1px solid var(--line);margin-bottom:12px}
.monthnav button{background:none;border:0;min-height:56px;font-size:20px;color:var(--brand-d)}
.monthnav button[disabled]{opacity:.25}
.monthnav div{text-align:center;font-weight:800;font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ebe4d2;border-radius:18px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;min-height:50px;border-radius:14px;font-weight:700;font-size:18px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 6px rgba(80,70,40,.12)}

/* ---------- 集計 ---------- */
.crow{padding:12px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.cline{display:flex;align-items:center;gap:8px}
.cbarrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.cbarrow .cbar{flex:1;margin-top:0}
.dot{flex:none;width:14px;height:14px;border-radius:50%}
.cn{flex:1;font-size:18px;font-weight:700}
.ca{font-weight:800;font-size:19px;white-space:nowrap}
.pc{color:var(--sub);font-size:15px;min-width:44px;text-align:right}
.cbar{height:8px;background:#f0ebdd;border-radius:9px;margin-top:8px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:9px}

/* ---------- 設定 ---------- */
.catchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.catchips span{display:inline-flex;align-items:center;min-height:38px;padding:4px 12px;border-radius:99px;background:#faf7ee;border:1px solid var(--line);font-size:16px;font-weight:600;white-space:nowrap}
.setrow{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:18px;font-weight:600}
.setrow:last-child{border-bottom:0}
.setrow .ic{font-size:24px;width:32px;text-align:center}
.setrow .ch{margin-left:auto;color:#b5ae9b}
.setrow.red{color:var(--danger)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.kv b{font-size:19px}

/* ---------- 下のタブ ---------- */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:20;
  background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(80,66,30,.07);
  padding:6px 6px calc(6px + var(--safe-b));display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr}
.tab{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--sub);min-height:60px;justify-content:center}
.tab .ic{font-size:25px;line-height:1.2}
.tab.on{color:var(--brand-d);font-weight:800}
.tab.plus{position:relative}
.tab.plus .fab{width:68px;height:68px;border-radius:50%;background:var(--brand);color:#fff;font-size:40px;line-height:1;
  border:4px solid #fff;box-shadow:0 6px 16px rgba(31,79,143,.38);transform:translateY(-24px);display:flex;align-items:center;justify-content:center;font-weight:300}
.tab.plus .lbl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:13px;color:var(--brand-d);font-weight:800}

/* ---------- 下から出るシート・確認ダイアログ ---------- */
#layer{position:relative;z-index:50}
.backdrop{position:fixed;inset:0;background:rgba(40,50,44,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;
  padding:10px 18px calc(22px + var(--safe-b));animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
.grab{width:44px;height:5px;border-radius:9px;background:#ddd6c4;margin:4px auto 12px}
.sheet h3{margin:4px 0 6px;font-size:21px}
.dlg-backdrop{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(40,50,44,.5)}
.dlg{background:#fff;border-radius:24px;padding:22px 20px 14px;width:100%;max-width:400px}
.dlg h3{font-size:20px;margin-bottom:8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}

/* ---------- 入力フォーム ---------- */
.field{display:block;margin-top:14px}
.field>span{display:block;font-weight:700;margin-bottom:6px;font-size:16px}
.field input,.field textarea,.bigInput{width:100%;min-height:56px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px;background:#fffdf8}
.field textarea{font-size:17px;min-height:96px}
.field input:focus,.field textarea:focus,.bigInput:focus{outline:none;border-color:var(--brand);background:#fff}
.field.need input{border-color:var(--warn);background:var(--warn-l)}
.hint{font-size:15px;color:var(--warn-d);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-size:17px;font-weight:600;min-height:50px}
.chips.compact{gap:6px}
.chips.compact .chip{min-height:42px;padding:6px 12px;font-size:16px}
/* 下に固定する操作ボタン（フォームが長くても、保存ボタンがいつも見える） */
.sheet-foot{position:sticky;bottom:calc(-22px - var(--safe-b));z-index:2;background:#fff;border-top:1px solid var(--line);
  margin:16px -18px calc(-22px - var(--safe-b));padding:12px 18px calc(12px + var(--safe-b))}
.sheet-foot .err{min-height:0;margin:0 0 6px}
.foot-row{display:grid;grid-template-columns:auto 1fr;gap:10px}
.foot-row .btn{margin-top:0}
.foot-row .btn.ghost{white-space:nowrap;padding:12px 20px}
.chips.tight{flex-wrap:nowrap}
.chips.tight .chip{flex:1;padding:8px 4px;font-size:16px}
.chip.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.err{color:var(--danger);font-weight:700;min-height:1.4em;margin-top:8px}
details.memo{margin-top:14px}
details.memo summary{font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--brand-d)}
.moneyrow{display:flex;align-items:center;gap:8px}
.moneyrow .bigInput{font-size:26px;font-weight:800}
.moneyrow span{font-size:20px;font-weight:700}
.choice{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;min-height:56px;font-weight:700;font-size:17px;padding:8px 12px}
.opt.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}

/* ---------- カテゴリ編集 ---------- */
.cerow{display:flex;gap:8px;align-items:center;margin-top:10px}
.cicon{flex:none;width:54px;height:54px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:26px}
.cname{flex:1;min-width:0;min-height:54px;border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-size:18px;background:#fffdf8}
.cdel{flex:none;width:54px;height:54px;border-radius:16px;border:2px solid #efc4bf;background:#fff;font-size:22px}
.lockmark{flex:none;width:66px;text-align:center;font-size:14px;color:var(--sub)}

/* ---------- 読み取り中の表示 ---------- */
.pbar{height:14px;background:#ece6d6;border-radius:99px;overflow:hidden;margin:16px 0}
.pbar i{display:block;height:100%;width:5%;background:var(--brand);border-radius:99px;transition:width .3s}

#toast{position:fixed;left:50%;width:max-content;bottom:calc(104px + var(--safe-b));transform:translate(-50%,20px);z-index:140;max-width:88vw;
  background:var(--brand-d);color:#fff;padding:13px 22px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid #7fb0e3;outline-offset:2px}

/* ---------- タイトル・説明（オンボーディング） ---------- */
#onboarding{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#fbf8f0 0%,#f2f7fc 100%);
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.ob-wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:36px 22px calc(28px + var(--safe-b));
  display:flex;flex-direction:column}
.ob-badge{font-size:15px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.logo{vertical-align:-4px;margin-right:8px}
.ob-title{font-size:34px;font-weight:800;margin:6px 0 16px;color:var(--brand-d)}
.ob-copy{font-size:17px;line-height:1.85}
.ob-copy p{margin:0 0 14px}
.ob-copy b{color:var(--brand-d)}
.ob-flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:var(--brand-l);
  border-radius:16px;padding:14px 10px;margin:18px 0;font-weight:800;color:var(--brand-d);font-size:16px}
.ob-flow span.arrow{color:var(--sub);font-weight:400}
.ob-spacer{flex:1}
.ob-foot{margin-top:22px}
.ob-h{font-size:18px;font-weight:800;margin:22px 0 8px}
.ob-list{margin:0;padding:0;list-style:none}
.ob-list li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.7}
.ob-list li:last-child{border-bottom:0}
.ob-list li .ic{flex:none}
.ob-dots{display:flex;justify-content:center;gap:8px;margin:20px 0 4px}
.ob-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.ob-dots i.on{background:var(--brand)}
/* ご相談ボタン：四角で囲んで、押せるボタンだと分かるようにする */
.consult-row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;margin-top:10px;padding:12px 14px;background:#fff;
  border:2px solid #b7cfe8;border-radius:16px;box-shadow:0 3px 0 #cfe0f2;text-align:left;font-size:17px;font-weight:700;text-decoration:none;color:inherit}
.consult-row:active{transform:translateY(2px);box-shadow:0 1px 0 #cfe0f2;background:var(--brand-l)}
.consult-row .ic{font-size:24px;width:32px;text-align:center}
.consult-row .sub2{display:block;font-size:14.5px;font-weight:400;color:var(--sub);margin-top:2px}
.consult-row .ch{margin-left:auto;color:#b5ae9b;flex:none}

/* ---------- 上の小さなボタン（使いかた／タイトル） ---------- */
#utilbar{position:absolute;top:6px;right:14px;z-index:5;display:flex;gap:6px}
.ubtn{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:800;font-size:20px;line-height:1;color:var(--brand-d);display:flex;align-items:center;justify-content:center}
.ubtn:active{background:var(--brand-l)}

/* ---------- タイトル画面（毎回表示）：猫の絵の下に3つのボタンがぴったり収まる ----------
   絵は 935x1683。猫の足の下端は高さの約71%なので、ボタンは下の約25%に置いています */
#title{position:fixed;inset:0;z-index:110;background:#bcd9ee;display:flex;justify-content:center;overflow:hidden}
#title[hidden]{display:none}
#title::before{content:"";position:absolute;inset:-30px;background:var(--title-img) center/cover no-repeat;filter:blur(22px)}
.title-stage{position:relative;height:100%;width:min(100vw,calc(100vh*935/1683));width:min(100vw,calc(100dvh*935/1683));
  background:var(--title-img) center top/cover no-repeat}
.title-btns{position:absolute;left:7%;right:7%;bottom:calc(3.4% + var(--safe-b));display:flex;flex-direction:column;gap:10px;gap:clamp(8px,1.3dvh,12px)}
.tbtn{height:58px;height:clamp(58px,7.6dvh,68px);border-radius:18px;border:2px solid #1f4f8f;background:rgba(255,255,255,.93);color:#1f4f8f;
  font-weight:800;font-size:19px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;
  box-shadow:0 4px 0 rgba(31,79,143,.35),0 8px 18px rgba(60,50,20,.18)}
.tbtn small{font-size:14px;font-weight:600;letter-spacing:0;color:#2f5687}
.tbtn.main{background:#1f4f8f;color:#fff}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,79,143,.35)}
.tbtn[disabled]{background:rgba(255,255,255,.74);color:#6b84a3;border-color:rgba(31,79,143,.3);box-shadow:none;transform:none}
.tbtn[disabled] small{color:#6f88a6}

/* ---------- 使いかた画面の手順 ---------- */
.ob-steps{margin:0;padding:0;list-style:none}
.ob-steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.7}
.ob-steps li:last-child{border-bottom:0}
.ob-steps .n{flex:none;width:28px;height:28px;margin-top:2px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.ob-steps .st{display:block;font-size:16.5px;font-weight:800}
.ob-steps .l{display:block}
.ob-steps .l+.l{margin-top:4px}
.ob-hr{border:0;border-top:1px solid var(--line);margin:22px 0 0}
</style>

  out.sort((a, b) => (a.id === 'other') - (b.id === 'other'));   // その他は最後

  if (['daily', 'weekly', 'monthly'].includes(b.periodType)) res.periodType = b.periodType;

const OCR = {
  worker: null,
  onLog: null,
  async loadLib() {
    if (window.Tesseract) return;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = CONFIG.OCR.SCRIPT_URL;
      s.onload = resolve;
      s.onerror = () => reject(new Error('読み取り部品を取り込めません'));
      document.head.appendChild(s);
    });
    if (!window.Tesseract) throw new Error('読み取り部品がありません');
  },
  async getWorker() {
    if (this.worker) return this.worker;
    await this.loadLib();
    let lastErr;
    for (const langPath of CONFIG.OCR.LANG_PATHS) {
      try {
        const opts = { logger: m => this.onLog && this.onLog(m) };
        if (langPath) opts.langPath = langPath;
        const w = await window.Tesseract.createWorker(CONFIG.OCR.LANG, 1, opts);
        await w.setParameters({ tessedit_pageseg_mode: '4', preserve_interword_spaces: '1' });
        this.worker = w;
        return w;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('ocr');
  },
  // 写真を縮めて白黒にし、コントラストを整える（読み取りやすくする）
  async prepareImage(file) {
    const img = await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('写真を開けません')); };
      im.src = url;
    });
    const scale = Math.min(1, CONFIG.OCR.MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    const id = ctx.getImageData(0, 0, w, h), d = id.data, hist = new Uint32Array(256);
    for (let i = 0; i < d.length; i += 4) { const g = ((d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000) | 0; d[i] = g; hist[g]++; }
    const total = w * h; let acc = 0, lo = 0, hi = 255;
    for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= total * 0.02) { lo = i; break; } }
    acc = 0;
    for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= total * 0.02) { hi = i; break; } }
    if (hi - lo < 30) { lo = 0; hi = 255; }
    const k = 255 / (hi - lo);
    for (let i = 0; i < d.length; i += 4) { let g = (d[i] - lo) * k; g = g < 0 ? 0 : g > 255 ? 255 : g; d[i] = d[i + 1] = d[i + 2] = g; }
    ctx.putImageData(id, 0, 0);
    return c;
  },
  async read(file, onStatus) {
    this.onLog = m => {
      const p = typeof m.progress === 'number' ? m.progress : 0;
      if (m.status === 'recognizing text') onStatus('文字を読み取っています…', 0.5 + p * 0.5);
      else onStatus('読み取りの準備をしています…', Math.min(0.45, 0.05 + p * 0.4));
    };
    onStatus('写真を整えています…', 0.03);
    const canvas = await this.prepareImage(file);
    const w = await this.getWorker();
    const { data } = await w.recognize(canvas);
    return data.text || '';
  },
  cancel() {
    if (this.worker) { const w = this.worker; this.worker = null; w.terminate().catch(() => {}); }
  }
};

/*PARSER-START*/
const ReceiptParser = {
  parse(text) {
    const lines = String(text || '').split(/\r?\n/).map(l => this.clean(l)).filter(Boolean);
    return { date: this.findDate(lines), store: this.findStore(lines), amount: this.findTotal(lines), items: this.findItems(lines) };
  },
  // 全角→半角、日本語の文字のあいだの余計な空白を消す
  clean(line) {
    return toHalf(line)
      .replace(/([\u3040-\u30ff\u3400-\u9fff])\s+(?=[\u3040-\u30ff\u3400-\u9fff])/g, '$1')
      .replace(/\s+/g, ' ').trim();
  },
  isPhone(l) { return /\d{2,4}-\d{2,4}-\d{3,4}/.test(l); },
  // 行の中の金額らしい数字を全部取り出す
  amountsIn(line) {
    const out = [], re = /\d{1,3}(?:[,.、]\d{3})+|\d+/g;
    let m;
    while ((m = re.exec(line))) {
      const raw = m[0], after = line.charAt(m.index + raw.length);
      if (/[点個枚%％本袋]/.test(after)) continue;                    // 「3点」「8%」などは金額ではない
      if (!/[,.、]/.test(raw) && raw.length >= 8) continue;            // 登録番号・電話番号
      const n = parseInt(raw.replace(/[,.、]/g, ''), 10);
      if (!n || n < 10 || n > 9999999) continue;
      out.push({ n, idx: m.index });
    }
    return out;
  },
  findDate(lines) {
    const now = new Date(), limit = dateStr(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2));
    const ok = (y, mo, d) => {
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      const s = `${y}-${pad(mo)}-${pad(d)}`;
      return isValidDate(s) && s <= limit && y >= 2000 ? s : null;
    };
    const pats = [
      [/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/, m => ok(+m[1], +m[2], +m[3])],
      [/(?:令和|R)\s*(\d{1,2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/, m => ok(2018 + +m[1], +m[2], +m[3])],
      [/(?:^|[^\d])(\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})(?!\d)/, m => ok(2000 + +m[1], +m[2], +m[3])]
    ];
    for (const [re, conv] of pats) for (const l of lines) { const m = re.exec(l); if (m) { const r = conv(m); if (r) return r; } }
    return null;
  },
  findStore(lines) {
    const skip = /領収|レシート|receipt|ご利用|ありがとう|毎度|いらっしゃい|TEL|電話|〒|住所|登録番号|担当|責任者|レジ|No\.|http|www|営業時間|お客様|ご来店|明細/i;
    for (const l of lines.slice(0, 8)) {
      if (skip.test(l) || this.isPhone(l)) continue;
      if (/[都道府県市区町村].*\d|丁目|番地/.test(l)) continue;                // 住所
      if (/\d{4}[年\/.\-]\d{1,2}/.test(l) || /\d{1,2}:\d{2}/.test(l)) continue; // 日付・時刻
      const name = l.replace(/^[\s*＊・\-—=_|:：#]+|[\s*＊・\-—=_|:：#]+$/g, '');
      if (name.length < 2 || name.length > 24) continue;
      if (!/[\u3040-\u30ff\u3400-\u9fffA-Za-z]{2,}/.test(name)) continue;
      return name;
    }
    return '';
  },
  findTotal(lines) {
    const exclude = /預|釣|お返|返金|ポイント|クーポン|値引|割引|現金|電話|TEL/i;
    const strong = /総合計|合計|お会計|お買上|お買い上|ご請求|請求金額|お支払金額|支払金額/;
    const cands = [];
    lines.forEach((l, i) => {
      if (exclude.test(l) || this.isPhone(l)) return;
      const m = strong.exec(l);
      if (!m) return;
      let a = this.amountsIn(l.slice(m.index + m[0].length));
      if (!a.length && lines[i + 1] && !exclude.test(lines[i + 1])) a = this.amountsIn(lines[i + 1]);   // 金額が次の行のとき
      if (a.length) cands.push(a[0].n);
    });
    if (cands.length) return Math.max(...cands);
    // 「合計」が見つからないときは、¥や円のついた金額のうち最大のもの
    const fallback = [];
    lines.forEach(l => {
      if (exclude.test(l) || this.isPhone(l) || !/[¥￥]|円/.test(l)) return;
      this.amountsIn(l).forEach(x => fallback.push(x.n));
    });
    return fallback.length ? Math.max(...fallback) : 0;
  },
  findItems(lines) {
    const ng = /合計|小計|税|預|釣|お返|点数|現金|カード|ポイント|クレジット|値引|割引|電話|TEL|領収|対象|支払|お買上|レジ|No\.|釣銭|端数/i;
    const re = /^(.*?[^\d\s¥,.、])\s*[¥]?\s*(\d{1,3}(?:[,.、]\d{3})+|\d{2,6})\s*円?\s*(?:[※*軽Ａ-Ｚa-zA-Z]|\(.*\))?$/;
    const items = [];
    for (const l of lines) {
      if (ng.test(l) || this.isPhone(l)) continue;
      const m = re.exec(l);
      if (!m) continue;
      const name = m[1].replace(/^[\s*＊・\-—=_|:：#\d]+|[\s]+$/g, '');
      const price = parseInt(m[2].replace(/[,.、]/g, ''), 10);
      if (name.length < 2 || !/[\u3040-\u30ff\u3400-\u9fffA-Za-z]{2,}/.test(name) || !price) continue;
      items.push({ name: name.slice(0, 24), price });
      if (items.length >= 12) break;
    }
    return items;
  }
};
/*PARSER-END*/

function guessCategoryId(store, memo) {
  const t = `${store} ${memo}`;
  for (const [id, re] of CAT_HINTS) if (re.test(t) && cats().some(c => c.id === id)) return id;
  return null;
}

// ファイルを保存する。戻り値：保存の操作に進めたか（共有シートを閉じたときは false）
// ホーム画面から開いたアプリ(PWA)では、ダウンロードが使えない端末があるため、共有シート（「ファイルに保存」）を優先する
async function download(filename, blob) {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (standalone && navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
    } catch (e) {
      if (e && e.name === 'AbortError') return false;   // 共有シートを閉じた
      /* それ以外は、ふつうのダウンロードに切りかえる */
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}

  let hero;

    hero = `<section class="card hero">
      <h2 class="q">${q}</h2>

    const warnRing = over || pct >= 90;                                    // 予算の9割をこえたら橙にする

    // 金額が変わったときだけ、前回の位置から今の位置まで青い弧をのばす（画面を切り替えただけなら動かさない）
    const ringKey = spent + '/' + budget, prevRing = App._ring;
    const still = !!(prevRing && prevRing.key === ringKey), p0 = prevRing ? prevRing.arc : 0;
    App._ring = { key: ringKey, arc };
    hero = `<section class="card hero">
      <h2 class="q">${q}</h2>
      <div class="ring ${over ? 'over' : ''} ${warnRing ? 'warn' : ''} ${still ? 'still' : ''}" style="--p:${arc};--r:${100 - arc};--p0:${p0};--r0:${100 - p0};--k:${k}">
        <svg viewBox="0 0 42 42" class="ringsvg" role="img" aria-label="${esc(p.label)}の残り予算 ${over ? '予算超過 ' + yen(-left) : yen(left)}、予算の${Math.round(pct)}%を使用">
          <circle class="rtrack" cx="21" cy="21" r="15.9155"/>
          ${arc > 0 ? '<circle class="rarc" cx="21" cy="21" r="15.9155" stroke-dashoffset="25"/>' : ''}
        </svg>
        <div class="rcenter"><span class="rl">${over ? '予算超過' : '残り'}</span><b class="rn">${shown}<small>円</small></b></div>
      </div>
      ${over
        ? `<div class="perday warn">${p.unitLabel}の予算を使い切りました。${daysInPeriod > 1 ? `<br>残り${daysLeft}日は、支出を控えめにしましょう。` : ''}</div>`
        : `${daysInPeriod > 1 ? `<div class="perday"><span class="nw">1日あたり</span> <span class="nw"><b>${yen(perDay)}</b></span> <span class="nw">が目安</span>
           <div class="perday-sub">${p.label}は残り${daysLeft}日（今日を含む）</div></div>` : ''}`}
      <div class="two">
        <div><span>${p.unitLabel}の予算</span><b>${yen(budget)}</b></div>
        <div><span>支出額</span><b>${yen(spent)}</b></div>
      </div>
    </section>`;
  }

  const recent = sortedExpenses(App.expenses).slice(0, 3);
  // バックアップのお知らせ：最後のバックアップから30日後。まだ一度もしていない人には、使い始めて2週間後から
  const oldest = App.expenses.length ? Math.min(...App.expenses.map(e => e.createdAt)) : Date.now();
  const days = Math.floor((Date.now() - (App.meta.lastBackupAt ? new Date(App.meta.lastBackupAt).getTime() : oldest)) / 86400000);
  const remind = App.expenses.length > 0 && days >= (App.meta.lastBackupAt ? CONFIG.BACKUP_REMIND_DAYS : 14);

  return `
    <header class="top"><h1>${LOGO_SVG}ヒキザン</h1><span class="sub">${now.getMonth() + 1}月${now.getDate()}日</span></header>
    ${DB.memory ? `<div class="notice">⚠️ この環境ではデータを保存できません（プライベートモードなど）。通常のブラウザで開いてください。</div>` : ''}
    ${hero}
    ${remind ? `<div class="notice" style="margin-top:16px"><b>💾 バックアップを取りませんか？</b><br>

      <button class="btn soft" data-act="backup">今すぐバックアップを取る</button></div>` : ''}
    <div class="sec-head"><h2>最近の支出</h2>${recent.length ? `<button class="linkbtn" data-act="tab" data-tab="list">すべて見る</button>` : ''}</div>
    ${recent.length ? recent.map(e => `<div class="dayhead" style="margin-top:6px">${mdLabel(e.date)}</div>${expenseRow(e)}`).join('')

function donutSvg(rows, total) {
  const R = 15.9155;      // 円周がちょうど100になる半径
  const gap = rows.length > 1 ? 0.8 : 0;   // 項目のあいだに小さなすき間をあける
  let acc = 0;
  const segs = rows.map(r => {
    const p = r.amount / total * 100, len = Math.max(p - gap, 0.1);
    const s = `<circle cx="21" cy="21" r="${R}" fill="none" stroke="${r.color}" stroke-width="4.6" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${25 - acc}"/>`;
    acc += p;
    return s;
  }).join('');
  return `<svg viewBox="0 0 42 42" class="ringsvg" role="img" aria-label="支出の割合"><circle class="rtrack" cx="21" cy="21" r="${R}" style="stroke-width:4.6"/>${segs}</svg>`;
}

async function runOcr(file) {
  const token = ++ocrToken;
  const body = Sheet.show(`
    <h3>読み取り中です</h3>
    <p id="ocr-msg" class="muted">準備しています…</p>
    <div class="pbar"><i id="ocr-bar"></i></div>
    <p class="muted small">初回のみ、読み取りに使うデータをインターネットから取得するため、少し時間がかかります。</p>
    <button class="btn ghost" data-act="ocrCancel">キャンセル</button>`);
  Sheet.locked = true;
  try {
    const text = await OCR.read(file, (msg, p) => {
      if (token !== ocrToken) return;
      const m = $('#ocr-msg', body), b = $('#ocr-bar', body);
      if (m) m.textContent = msg;
      if (b) b.style.width = Math.round(Math.max(5, Math.min(100, p * 100))) + '%';
    });
    if (token !== ocrToken) return;
    const r = ReceiptParser.parse(text);
    Sheet.locked = false;
    const memo = r.items.map(i => `${i.name} ${num(i.price)}円`).join('\n');
    const found = !!(r.amount || r.store || r.date);
    openExpenseForm({
      mode: 'ocr',
      prefill: { date: r.date || todayStr(), store: r.store, amount: r.amount || '', memo, categoryId: guessCategoryId(r.store, memo) },
      warn: found ? '' : 'うまく読み取れませんでした。レシートを見ながら入力してください。'
    });
  } catch (err) {
    console.error(err);
    if (token !== ocrToken) return;
    Sheet.locked = false;
    openExpenseForm({ mode: 'ocr', prefill: {}, warn: '読み取れませんでした。インターネットに接続されているかご確認ください。手入力での記録も可能です。' });
  }
}

// ---- 支出の登録・修正フォーム ----
function openExpenseForm({ expense = null, prefill = null, mode = 'manual', warn = '' } = {}) {
  const isEdit = !!expense, v = expense || prefill || {};
  const cs = cats();
  let catId = cs.some(c => c.id === v.categoryId) ? v.categoryId
    : cs.some(c => c.id === App.meta.lastCategoryId) ? App.meta.lastCategoryId
    : (cs.find(c => c.id === 'food') || cs[0]).id;
  const title = isEdit ? '内容を修正' : mode === 'ocr' ? '読み取った内容をご確認ください' : '支出を記録する';
  const needAmount = mode === 'ocr' && !v.amount;
  const needStore = mode === 'ocr' && !v.store;

  const body = Sheet.show(`
    <h3>${esc(title)}</h3>
    ${mode === 'ocr' && !warn ? '<p class="muted">誤りがあれば修正してください。</p>' : ''}
    ${warn ? `<div class="notice" style="margin-top:8px">${esc(warn)}</div>` : ''}
    <label class="field ${needAmount ? 'need' : ''}"><span>合計金額</span>
      <div class="moneyrow"><input class="bigInput" style="border-radius:16px" type="text" inputmode="numeric" id="f-amount" placeholder="例：4,280" value="${v.amount ? num(v.amount) : ''}"><span>円</span></div>
      ${needAmount ? '<div class="hint">金額を入力してください</div>' : ''}</label>
    <div class="field"><span>カテゴリ</span>
      <div class="chips compact" id="f-cats">${cs.map(c => `<button type="button" class="chip ${c.id === catId ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</button>`).join('')}</div></div>
    <label class="field ${needStore ? 'need' : ''}"><span>品目・店名</span><input type="text" id="f-store" maxlength="60" autocomplete="off" placeholder="例：スーパー、お菓子" value="${esc(v.store || '')}"></label>
    <label class="field"><span>日付</span><input type="date" id="f-date" value="${esc(v.date || todayStr())}"></label>
    <details class="memo" ${v.memo ? 'open' : ''}><summary>📝 メモ（任意）</summary>
      <label class="field" style="margin-top:6px"><textarea id="f-memo" rows="4" maxlength="500">${esc(v.memo || '')}</textarea></label></details>
    ${isEdit ? '<button class="btn dangerline" id="f-del">🗑️ この記録を削除する</button>' : ''}
    <div class="sheet-foot">
      <div class="err" id="f-err" role="alert"></div>
      <div class="foot-row">
        <button class="btn ghost" id="f-cancel">キャンセル</button>
        <button class="btn primary" id="f-save">${isEdit ? '修正を保存する' : '記録する'}</button>
      </div>
    </div>`);

  bindMoneyInput($('#f-amount', body));
  $('#f-cats', body).addEventListener('click', e => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    catId = b.dataset.cat;
    $$('#f-cats .chip', body).forEach(x => x.classList.toggle('on', x === b));
  });
  $('#f-cancel', body).onclick = () => Sheet.close();

  $('#f-save', body).onclick = async () => {
    const err = $('#f-err', body);
    const date = $('#f-date', body).value, amount = parseAmount($('#f-amount', body).value);
    if (!isValidDate(date)) { err.textContent = '日付を選んでください'; return; }
    if (amount <= 0) { err.textContent = '金額を入力してください'; $('#f-amount', body).focus(); return; }
    if (amount > 99999999) { err.textContent = '金額が大きすぎます'; return; }
    const e = {
      id: isEdit ? expense.id : uid(), date, amount, categoryId: catId,
      store: $('#f-store', body).value.trim().slice(0, 60),
      memo: $('#f-memo', body).value.trim().slice(0, 500),
      createdAt: isEdit ? expense.createdAt : Date.now()
    };
    if (!await upsertExpense(e)) return;
    App.meta.lastCategoryId = catId; saveMeta('lastCategoryId');
    Sheet.close();
    if (isEdit) { render(); toast('修正しました'); return; }
    App.listYm = monthKey(new Date());
    goTab('home');
    // 登録したあと「あといくらか」をすぐ見せる
    const p = currentPeriod(), b = getPeriodBudget(p);
    const inPeriod = date >= dateStr(p.start) && date <= dateStr(p.end);
    const left = b != null ? b - sum(expensesInPeriod(p)) : null;
    toast(b != null && inPeriod ? (left >= 0 ? `記録しました。${p.label}の残りは${yen(left)}です` : `記録しました。${p.unitLabel}の予算を超えています`) : '記録しました');
  };

  if (isEdit) {
    $('#f-del', body).onclick = async () => {
      const ok = await confirmDialog({ title: 'この記録を削除しますか？', message: `${mdLabel(expense.date)} ${expense.store || ''} ${yen(expense.amount)}`, okText: '削除する', cancelText: 'キャンセル', danger: true });

      if (await removeExpense(expense.id)) { Sheet.close(); render(); toast('削除しました'); }
    };
  }
}

// ---- 予算の設定 ----
function openBudgetSheet({ first = false } = {}) {
  let type = App.meta.budget.periodType || 'monthly';
  let onceMode = 'monthly';
  const ym = monthKey(new Date());
  if (type === 'monthly') onceMode = (App.meta.budget.monthOverrides[ym] != null && App.meta.budget.amounts.monthly == null) ? 'once' : 'monthly';
  const CHIPS = { daily: [1000, 2000, 3000], weekly: [5000, 10000, 15000], monthly: [200000, 300000, 400000] };
  const PERIOD_DESC = { daily: '1日に使える金額を設定します', weekly: '日曜日から土曜日までの1週間で設定します', monthly: '1日から月末までの1か月で設定します' };

  function draw() {
    const cur = type === 'monthly' ? (App.meta.budget.monthOverrides[ym] ?? App.meta.budget.amounts.monthly) : App.meta.budget.amounts[type];
    const body = Sheet.show(`
      ${first ? '<h3>はじめに</h3><p class="muted">最初に、使える金額（予算）を設定しましょう。</p>' : '<h3>予算を設定する</h3>'}
      <div class="seg" id="b-type" style="grid-template-columns:1fr 1fr 1fr;margin-top:${first ? 12 : 8}px">
        ${['daily', 'weekly', 'monthly'].map(t => `<button type="button" class="${t === type ? 'on' : ''}" data-t="${t}">${PERIOD_LABEL[t]}</button>`).join('')}
      </div>
      <p class="muted small" style="margin:-6px 4px 12px">${PERIOD_DESC[type]}</p>
      <div class="moneyrow"><input class="bigInput" type="text" inputmode="numeric" id="b-amount" placeholder="例：${num(CHIPS[type][1])}" value="${cur ? num(cur) : ''}"><span>円</span></div>
      <div class="chips tight" style="margin-top:10px">${CHIPS[type].map(n => `<button type="button" class="chip" data-v="${n}">${num(n)}円</button>`).join('')}</div>
      ${type === 'monthly'
        ? `<div class="field"><span>毎月同じ予算にしますか？</span>
        <div class="choice">
          <button type="button" class="opt ${onceMode === 'monthly' ? 'on' : ''}" data-mode="monthly">はい（毎月同じ）</button>
          <button type="button" class="opt ${onceMode === 'once' ? 'on' : ''}" data-mode="once">いいえ（今月だけ）</button>
        </div></div>`
        : `<p class="muted small" style="margin-top:10px">次の${type === 'daily' ? '日' : '週'}も、同じ予算が続きます。</p>`}
      <div class="err" id="b-err" role="alert"></div>
      <button class="btn primary big" id="b-save">この内容で設定する</button>
      ${first ? '<button class="btn ghost" id="b-skip">後で設定する</button>' : '<button class="btn ghost" id="b-cancel">キャンセル</button>'}`);
    if (first) Sheet.locked = true;

    $$('#b-type [data-t]', body).forEach(b => b.addEventListener('click', () => { type = b.dataset.t; draw(); }));
    const input = $('#b-amount', body);
    bindMoneyInput(input);
    $$('[data-v]', body).forEach(b => b.addEventListener('click', () => { input.value = num(+b.dataset.v); }));
    if (type === 'monthly') $$('[data-mode]', body).forEach(b => b.addEventListener('click', () => {
      onceMode = b.dataset.mode;
      $$('[data-mode]', body).forEach(x => x.classList.toggle('on', x === b));
    }));
    const done = () => { App.meta.budgetPromptedYm = ym; saveMeta('budgetPromptedYm'); };
    if (first) $('#b-skip', body).onclick = () => { done(); Sheet.close(); };
    else $('#b-cancel', body).onclick = () => Sheet.close();
    $('#b-save', body).onclick = async () => {
      const n = parseAmount(input.value);
      if (n <= 0) { $('#b-err', body).textContent = '予算の金額を入力してください'; return; }
      if (n > 99999999) { $('#b-err', body).textContent = '金額が大きすぎます'; return; }
      App.meta.budget.periodType = type;
      if (type === 'monthly') {
        if (onceMode === 'monthly') { App.meta.budget.amounts.monthly = n; delete App.meta.budget.monthOverrides[ym]; }
        else App.meta.budget.monthOverrides[ym] = n;
      } else {
        App.meta.budget.amounts[type] = n;
      }
      if (!await saveMeta('budget')) return;
      done(); Sheet.close(); render(); toast('予算を設定しました');
    };
  }

  draw();
}

function openCategoryEditor() {
  const original = clone(cats());
  let draft = clone(cats());
  const body = Sheet.open('');
  const collect = () => $$('.cname', body).forEach(inp => { draft[+inp.dataset.i].name = inp.value; });
  const paint = () => {
    body.innerHTML = `<h3>カテゴリを編集</h3>
      <p class="muted small">名前の変更・追加・削除ができます。左のアイコンをタップすると、アイコンが切り替わります。削除したカテゴリの支出は「その他」にまとめられます。</p>
      ${draft.map((c, i) => `<div class="cerow">
        <button type="button" class="cicon" data-a="icon" data-i="${i}" aria-label="アイコンを変える">${esc(c.icon)}</button>
        <input class="cname" data-i="${i}" maxlength="12" value="${esc(c.name)}" placeholder="カテゴリ名">
        ${c.id === 'other' ? '<span class="lockmark">削除不可</span>' : `<button type="button" class="cdel" data-a="del" data-i="${i}" aria-label="削除">🗑️</button>`}</div>`).join('')}
      <button class="btn soft" data-a="add">＋ カテゴリを追加</button>
      <button class="btn primary big" data-a="save">保存する</button>
      <button class="btn ghost" data-a="cancel">キャンセル</button>`;
  };
  paint();
  body.addEventListener('click', async e => {
    const t = e.target.closest('[data-a]');
    if (!t) return;
    const a = t.dataset.a, i = +t.dataset.i;
    if (a === 'cancel') return Sheet.close();
    collect();
    if (a === 'icon') { const k = ICON_CHOICES.indexOf(draft[i].icon); draft[i].icon = ICON_CHOICES[(k + 1) % ICON_CHOICES.length]; paint(); }
    else if (a === 'add') { draft.splice(draft.length - 1, 0, { id: uid(), name: '', icon: '🏷️' }); paint(); const inputs = $$('.cname', body); inputs[inputs.length - 2].focus(); }
    else if (a === 'del') { draft.splice(i, 1); paint(); }
    else if (a === 'save') {
      const orig = Object.fromEntries(original.map(c => [c.id, c]));
      draft = draft.map(c => ({ ...c, name: c.name.trim() || (orig[c.id] ? orig[c.id].name : '') })).filter(c => c.name);
      const final = cleanCategories(draft);
      const keep = new Set(final.map(c => c.id));
      const moved = App.expenses.filter(x => !keep.has(x.categoryId) && original.some(c => c.id === x.categoryId)).map(x => ({ ...x, categoryId: 'other' }));
      const ok = await safely(async () => { await DB.putMany('expenses', moved); await DB.put('meta', { key: 'categories', value: final }); });
      if (!ok) return;
      moved.forEach(m => { const k = App.expenses.findIndex(x => x.id === m.id); if (k >= 0) App.expenses[k] = m; });
      App.meta.categories = final;
      Sheet.close(); render(); toast('カテゴリを更新しました');
    }
  });
}

async function backupNow() {
  const data = {
    app: CONFIG.APP_ID, version: 1, exportedAt: new Date().toISOString(),
    categories: App.meta.categories, budget: App.meta.budget, expenses: App.expenses
  };
  const saved = await download(`hikizan-backup-${todayStr()}.json`, new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  if (!saved) return;   // 保存せずに閉じたときは「バックアップした」ことにしない
  App.meta.lastBackupAt = new Date().toISOString();
  await saveMeta('lastBackupAt');
  render();
  toast('バックアップを保存しました');
}

async function restoreFrom(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || data.app !== CONFIG.APP_ID || !Array.isArray(data.expenses)) {
    toast('このファイルは読み込めませんでした。ヒキザンのバックアップファイルを選んでください');
    return;
  }
  const expenses = data.expenses.map(cleanExpense).filter(Boolean);
  const ok = await confirmDialog({
    title: '現在のデータをバックアップの内容に置き換えますか？',
    message: `バックアップの内容（支出の記録 ${expenses.length}件）に置き換わります。現在のデータは削除されます。`,
    okText: '置き換える', cancelText: 'キャンセル', danger: true
  });
  if (!ok) return;
  const categories = cleanCategories(data.categories && data.categories.length ? data.categories : DEFAULT_CATEGORIES);
  const budget = cleanBudget(data.budget);
  const rows = [
    { key: 'categories', value: categories }, { key: 'budget', value: budget },
    { key: 'lastBackupAt', value: App.meta.lastBackupAt }, { key: 'budgetPromptedYm', value: monthKey(new Date()) }
  ];
  if (!await safely(() => DB.replaceAll(expenses, rows))) return;
  App.expenses = expenses; App.meta.categories = categories; App.meta.budget = budget;
  App.meta.budgetPromptedYm = monthKey(new Date());
  render();
  toast(`復元しました（${expenses.length}件）`);
}

function exportCsv() {
  // Excelで開いても文字化けしないよう先頭にBOMをつける。=+-@ で始まる文字は式にならないよう保護
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
  const rows = [['日付', '店名・品目', '金額', 'カテゴリ', 'メモ'].map(cell).join(',')];
  sortedExpenses(App.expenses).reverse().forEach(e => rows.push([cell(e.date), cell(e.store), e.amount, cell(catById(e.categoryId).name), cell(e.memo)].join(',')));
  download(`hikizan-${todayStr()}.csv`, new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  toast('CSVファイルを書き出しました');
}

async function wipeAll() {
  if (!await confirmDialog({ title: 'すべてのデータを削除しますか？', message: '支出の記録・予算・カテゴリがすべて削除されます。元に戻すことはできません。先にバックアップを取っておくことをおすすめします。', okText: '削除に進む', cancelText: 'キャンセル', danger: true })) return;
  if (!await confirmDialog({ title: '本当に削除しますか？', message: 'この操作は元に戻せません。', okText: 'すべて削除する', cancelText: 'キャンセル', danger: true })) return;
  if (!await safely(() => DB.replaceAll([], []))) return;
  App.expenses = [];
  App.meta = {
    categories: clone(DEFAULT_CATEGORIES),
    budget: { periodType: 'monthly', amounts: { daily: null, weekly: null, monthly: null }, monthOverrides: {} },
    lastBackupAt: null, budgetPromptedYm: null, lastCategoryId: null, onboarded: true
  };
  await safely(() => DB.put('meta', { key: 'onboarded', value: true }));
  goTab('home');
  toast('すべて削除しました');
  setTimeout(maybePromptBudget, 400);
}

// 「つづきから」を押せる条件：いまの期間の予算が決まっている ＝ 前回のミッションが残っている
function missionInfo() {
  const p = currentPeriod(), budget = getPeriodBudget(p);
  if (budget == null) return null;
  return { p, budget, left: budget - sum(expensesInPeriod(p)) };
}

function showTitle() {
  if (Sheet.el) Sheet.close();
  closeGuide();
  const m = missionInfo();
  const lab = m ? m.p.label : '';
  const sub = m ? (m.left >= 0 ? `前回の予算　${lab}あと${yen(m.left)}` : `前回の予算　${lab}は予算オーバー`) : '前回の予算はありません';
  const t = $('#title');
  t.innerHTML = `<div class="title-stage">
    <h1 class="vh">${esc(CONFIG.APP_NAME)}　予算管理アプリ</h1>
    <div class="title-btns">
      <button class="tbtn main" data-act="titleNew">最初から</button>
      <button class="tbtn" data-act="titleContinue" ${m ? '' : 'disabled'}>続きから<small>${esc(sub)}</small></button>
      <button class="tbtn" data-act="titleGuide">使い方</button>
    </div></div>`;
  t.hidden = false;
}
const hideTitle = () => { $('#title').hidden = true; App._ring = null; };   // タイトルから入るときは、ゲージを0から伸ばして見せる
const closeGuide = () => { $('#onboarding').hidden = true; };

function showGuide(mode) {
  hideTitle();
  const g = $('#onboarding');
  g.innerHTML = renderGuide(mode);
  g.dataset.mode = mode;
  g.hidden = false;
  g.scrollTop = 0;
}

function renderGuide(mode) {
  const foot = mode === 'new'
    ? '<button class="btn primary big btn2" data-act="guideStart"><span class="l1">✓ 確認しました</span><span class="l2">予算を設定する</span></button>'
    : `<button class="btn ghost" data-act="guideBack">${mode === 'app' ? '閉じる' : 'タイトルに戻る'}</button>`;
  return `<div class="ob-wrap">
    <div><button class="linkbtn" data-act="guideBack" style="padding-left:0">${mode === 'app' ? '✕ 閉じる' : '‹ タイトルに戻る'}</button></div>
    <h1 class="ob-title">${LOGO_SVG}${esc(CONFIG.APP_NAME)}</h1>
    <p class="ob-copy" style="margin-bottom:6px">使える金額を先に決めて、無理のない家計管理を。</p>
    <div class="ob-flow">予算を決める<span class="arrow">→</span>使う<span class="arrow">→</span>引く<span class="arrow">→</span>残りを見る</div>
    <p class="ob-copy small" style="margin:0 4px">予算とは、期間内に使ってよいと決めた金額のことです。</p>

    <div class="ob-h" style="margin-top:14px">📖 使い方</div>
    <ol class="ob-steps">
      <li><span class="n">1</span><span><span class="st">予算を決める</span>
        <span class="l">「1日」「1週間」「1か月」のいずれかを選び、使える金額を設定します。</span></span></li>
      <li><span class="n">2</span><span><span class="st">使ったら記録する</span>
        <span class="l">「＋ 支出を記録する」を押し、レシートを撮影するか、品目と金額を入力します。</span>
        <span class="l">読み取った内容は、記録する前に確認・修正できます。</span></span></li>
      <li><span class="n">3</span><span><span class="st">残りを見る</span>
        <span class="l">ホームの<b>「今月の残り予算」</b>で、残りの金額を確認できます。</span>
        <span class="l">1日あたりに使える金額の目安も表示されるので、今後の支出を考えるときに役立ちます。</span></span></li>
      <li><span class="n">4</span><span><span class="st">間違えたとき</span>
        <span class="l">「履歴」タブで、該当の記録をタップします。</span>
        <span class="l">金額や品目を修正したり、削除したりできます。</span></span></li>
      <li><span class="n">5</span><span><span class="st">バックアップを取る</span>
        <span class="l">「設定」→「バックアップを取る」で、データをファイルとして保存できます。</span>
        <span class="l">大切なデータを守るため、月に1回程度バックアップを取っておくと安心です。</span></span></li>
    </ol>

    <hr class="ob-hr">
    <div class="ob-h">🔒 安心して使うために</div>
    ${noticeListHtml()}

    <div class="ob-h">⚠️ データについて</div>
    <div class="ob-copy small">
      <p>『${esc(CONFIG.APP_NAME)}』は、データを端末の中に保存するアプリです。</p>
      <p>端末の故障や紛失、ブラウザのデータ削除などにより、保存したデータが失われることがあります。</p>
      <p>大切なデータは、こまめにバックアップ（データの控えを保存すること）を取ってください。</p>
    </div>

    <hr class="ob-hr">
    <div class="ob-h">📡 お問い合わせ</div>
    ${consultButtonsHtml()}
    <div class="ob-spacer"></div>
    <div class="ob-foot">${foot}</div>
  </div>`;
}

// 「さいしょから」：使いかた画面を一度はさんでから、予算を決めなおす（支出の記録は消さない）
async function titleNew() {
  if (missionInfo()) {
    const ok = await confirmDialog({
      title: '最初から始めますか？',
      message: '予算を設定し直します。これまでの支出の記録は削除されません。',
      okText: '最初から', cancelText: 'キャンセル'
    });
    if (!ok) return;
  }
  showGuide('new');
}
async function guideStart() {
  App.meta.onboarded = true;                 // 使いかた・注意事項を読んで同意した記録
  await saveMeta('onboarded');
  closeGuide(); hideTitle();
  goTab('home');
  setTimeout(() => openBudgetSheet({ first: true }), 250);
}
function titleContinue() {
  if (!missionInfo()) return;
  hideTitle();
  goTab('home');
}

/* =========================================================
   12. 起動
   ========================================================= */
// ボタンの動き（data-act の名前ごとにまとめています。機能を足すときはここに追加）
const ACTIONS = {
  tab:        t => goTab(t.dataset.tab),
  register:   () => openRegister(),
  manual:     () => openExpenseForm({ mode: 'manual' }),
  edit:       t => { const e = App.expenses.find(x => x.id === t.dataset.id); if (e) openExpenseForm({ expense: e }); },
  budget:     () => openBudgetSheet(),
  listPrev:   () => { App.listYm = addMonths(App.listYm, -1); render(); },
  listNext:   () => { if (App.listYm < monthKey(new Date())) { App.listYm = addMonths(App.listYm, 1); render(); } },
  sumWhich:   t => { App.sumWhich = t.dataset.w; render(); },
  ocrCancel:  () => { ocrToken++; OCR.cancel(); Sheet.close(); },
  catEdit:    () => openCategoryEditor(),
  backup:     () => backupNow(),
  csv:        () => exportCsv(),
  wipe:       () => wipeAll(),
  calendar:   () => openCalendarSheet(),
  about:         () => showGuide('app'),
  guideApp:      () => showGuide('app'),
  goTitle:       () => showTitle(),
  titleNew:      () => titleNew(),
  titleContinue: () => titleContinue(),
  titleGuide:    () => showGuide('view'),
  guideBack:     () => { if ($('#onboarding').dataset.mode === 'app') closeGuide(); else showTitle(); },
  guideStart:    () => guideStart()
};

function maybePromptBudget() {
  const ym = monthKey(new Date());
  if (getPeriodBudget() != null || App.meta.budgetPromptedYm === ym || Sheet.el) return;
  const neverSet = Object.values(App.meta.budget.amounts).every(v => v == null) && Object.keys(App.meta.budget.monthOverrides).length === 0;
  openBudgetSheet({ first: neverSet });
}

async function init() {
  await DB.open();
  try { await loadAll(); } catch (e) { console.error(e); }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t && ACTIONS[t.dataset.act]) ACTIONS[t.dataset.act](t, e);
  });
  $('#in-restore').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) restoreFrom(f);
  });
  // アプリを開いたまま日付が変わっても、戻ってきたときに最新にする
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !Sheet.el) render(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && Sheet.el && !Sheet.locked) Sheet.close(); });

  render();
  // 端末に「消さないで」とお願いする（対応ブラウザのみ）
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 無視してOK */ }
  // PWA：オフラインでも開けるようにする（https か localhost でだけ動く）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('サービスワーカーを登録できませんでした', err));
  }
  showTitle();   // 毎回、タイトル画面から始まる
}
init();
})();
</script>
<script>
/* 日本語の改行位置：文節の切れ目に <wbr> を入れる（語の途中で折れるのを防ぐ）
   ・「、。！？・」のあと
   ・ひらがなのあとに、漢字・カタカナ・英数字・「（が続くところ（例：予算を｜決める）
   ・「お」「ご」のあとは切らない（お店、ご確認 など） */
(function () {
  var HIRA = /[\u3041-\u309F]/, HEAD = /[\u3400-\u9FFF\u30A1-\u30FA\u30FD-\u30FF0-9A-Za-z]/;
  var JP = /[\u3040-\u30FF\u4E00-\u9FFF]/, SKIP = /^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|CODE|svg)$/i;
  function segments(t) {
    var out = [], cur = '';
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i);
      if (i > 0) {
        var p = t.charAt(i - 1), br = false;
        if ('、。！？・'.indexOf(p) >= 0 && '、。！？」』）】'.indexOf(c) < 0 && c !== ' ') br = true;
        else if (HIRA.test(p) && p !== 'お' && p !== 'ご' && HEAD.test(c)) br = true;
        else if ('「『（【'.indexOf(c) >= 0 && p !== ' ') br = true;
        if (br) { out.push(cur); cur = ''; }
      }
      cur += c;
    }
    out.push(cur);
    return out;
  }
  function fix(root) {
    if (root.nodeType === 3) root = root.parentNode;
    if (!root || root.nodeType !== 1) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [], n;
    while ((n = w.nextNode())) list.push(n);
    list.forEach(function (t) {
      var par = t.parentNode;
      if (!par || SKIP.test(par.nodeName) || (par.closest && par.closest('svg,[data-nowbr]'))) return;
      if (!JP.test(t.nodeValue)) return;
      if (par.nodeType === 1 && /^nowrap/.test(getComputedStyle(par).whiteSpace)) return;   // 1行にしたい所は触らない
      var seg = segments(t.nodeValue);
      if (seg.length < 2) return;
      var f = document.createDocumentFragment();
      seg.forEach(function (x, i) { if (i) f.appendChild(document.createElement('wbr')); f.appendChild(document.createTextNode(x)); });
      par.replaceChild(f, t);
    });
  }
  fix(document.body);
  new MutationObserver(function (ms) {
    ms.forEach(function (m) { m.addedNodes.forEach(function (nd) { if (nd.nodeName !== 'WBR') fix(nd); }); });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
